abstract: |
  Clock skew scheduling (CSS) assigns clock arrival times so that every setup-
  and hold-time constraint is met while a secondary objective is optimized. This
  survey rests on one idea: the timing constraints of a synchronous circuit form a
  system of difference constraints, feasible when the timing constraint graph has
  no negative cycle. Period minimization, slack maximization, and yield-driven
  scheduling reduce to parametric potential problems solved by Bellman--Ford,
  Lawler, Howard, Karp, and the ellipsoid method. We extend the core with delay
  padding, statistical methods, GEV delay models, and clock-tree co-optimization,
  closing with idealizations, common misconceptions, and open problems.
