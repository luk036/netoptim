# This workflow installs Python dependencies and runs the static-analysis,
# documentation, and packaging quality gates on a single Python version.
# For more information see:
# https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python package

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[testing,docs]"
          pip install mypy flake8 build twine
      - name: Lint (blocking errors)
        run: flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Lint (full style)
        run: flake8 src tests --count --statistics
      - name: Type check with mypy
        run: mypy src/
      - name: Run doctests
        run: pytest --doctest-modules src/netoptim -q --no-cov
      - name: Build documentation
        run: sphinx-build --color -b html docs docs/_build/html
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: twine check dist/*
